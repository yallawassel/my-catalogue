

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <title>My Catalogue</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f6f1; color: #17231f; }
    header { background: #173f35; color: white; padding: 22px 16px; }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; opacity: .85; }
    main { max-width: 1000px; margin: auto; padding: 18px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #d8dfd8; border-radius: 10px; font-size: 16px; background: white; }
    .filters { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 18px; }
    #products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { background: white; border: 1px solid #e1e6e0; border-radius: 14px; overflow: hidden; }
    .photo { aspect-ratio: 1; background: #e9eee8; display: grid; place-items: center; color: #537267; font-size: 26px; font-weight: bold; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .info { padding: 12px; }
    .info h3 { margin: 0 0 6px; font-size: 16px; overflow-wrap: anywhere; }
    .category { color: #6b7771; font-size: 13px; margin-bottom: 10px; }
    .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .price { background: #f3f6f2; padding: 8px; border-radius: 8px; overflow-wrap: anywhere; }
    .price small { display: block; color: #6b7771; font-size: 11px; }
    #empty { color: #6b7771; text-align: center; padding: 30px; }
    footer { text-align: center; padding: 24px; color: #6b7771; font-size: 13px; }
    @media (min-width: 650px) {
      #products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .filters { grid-template-columns: 2fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="company">My Catalogue</h1>
    <p id="subtitle">Your business products in one place</p>
  </header>
  <main>
    <div class="filters">
      <input id="search" type="search" placeholder="Search products...">
      <select id="category"><option value="">All categories</option></select>
    </div>
    <section id="products"></section>
    <p id="empty">Welcome! Your products will appear here when the catalogue is configured.</p>
  </main>
  <footer>My Catalogue · Business catalogue platform</footer>
  <script>
    // Temporary preview data. Supabase connection comes next.
    const demoProducts = [
      { name: "Sample Kraft Bag", category: "Paper Bags", price1Label: "Packet", price1: "4.00", price2Label: "Box", price2: "35.00" },
      { name: "Sample Food Container", category: "Food Packaging", price1Label: "Packet", price1: "6.00", price2Label: "Box", price2: "50.00" }
    ];

    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const grid = document.getElementById("products");
    const empty = document.getElementById("empty");

    [...new Set(demoProducts.map(p => p.category))].forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      category.appendChild(option);
    });

    function render() {
      const term = search.value.toLowerCase().trim();
      const selected = category.value;
      const list = demoProducts.filter(p =>
        (!selected || p.category === selected) &&
        (!term || (p.name + " " + p.category).toLowerCase().includes(term))
      );

      grid.innerHTML = "";
      list.forEach(p => {
        const card = document.createElement("article");
        card.className = "card";
        const initials = p.name.split(" ").slice(0, 2).map(s => s[0]).join("");
        card.innerHTML = `
          <div class="photo">${initials}</div>
          <div class="info">
            <h3></h3>
            <div class="category"></div>
            <div class="prices">
              <div class="price"><small></small><strong></strong></div>
              <div class="price"><small></small><strong></strong></div>
            </div>
          </div>`;
        card.querySelector("h3").textContent = p.name;
        card.querySelector(".category").textContent = p.category;
        const prices = card.querySelectorAll(".price");
        prices[0].querySelector("small").textContent = p.price1Label;
        prices[0].querySelector("strong").textContent = "USD " + p.price1;
        prices[1].querySelector("small").textContent = p.price2Label;
        prices[1].querySelector("strong").textContent = "USD " + p.price2;
        grid.appendChild(card);
      });
      empty.hidden = list.length > 0;
      if (!list.length) empty.textContent = "No products found.";
    }

    search.addEventListener("input", render);
    category.addEventListener("change", render);
    render();
  </script>
</body>
</html>
